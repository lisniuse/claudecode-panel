[package]
name = "claude-code-panel"
version = "0.1.0"
edition = "2024"
description = "A Windows sidebar for local Claude Code sessions"
license = "MIT"
repository = "https://github.com/lisniuse/claudecode-panel"

[[bin]]
name = "ClaudeCodePanel"
path = "src/main.rs"

[dependencies]
memchr = "2"
resvg = { version = "0.48.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
